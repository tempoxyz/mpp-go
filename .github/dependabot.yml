version: 2

multi-ecosystem-groups:
  weekly-dependencies:
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Los_Angeles

updates:
  # tests/ is a separate module that replaces mpp-go with ../ and repeats the
  # root requirements: update both so they stay in step.
  - package-ecosystem: gomod
    directories: [/, /tests]
    patterns: ["*"]
    multi-ecosystem-group: weekly-dependencies
    cooldown:
      default-days: 7
      semver-major-days: 7

  - package-ecosystem: github-actions
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: weekly-dependencies
    cooldown:
      # Buffer the scanner's seven-day minimum: Dependabot reads date-only tag metadata.
      default-days: 8

  # The mppx server the cross-SDK smoke workflow runs.
  - package-ecosystem: npm
    directory: /.github/smoke-cross-sdk
    patterns: ["*"]
    multi-ecosystem-group: weekly-dependencies
    cooldown:
      default-days: 7
      semver-major-days: 7
