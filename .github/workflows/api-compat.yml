name: API compatibility

# Fails a pull request that makes an incompatible change to the exported API
# under pkg/ (golang.org/x/exp/cmd/apidiff), unless one of its .changelog/*.md
# files declares a minor or major bump. Before v1, a breaking change is a
# minor bump. See AGENTS.md (Commands) to run the same check locally.

on:
  pull_request:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  apidiff:
    name: apidiff
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Install apidiff
        run: go install golang.org/x/exp/cmd/apidiff@v0.0.0-20261014143641-f0251eb4aa3e
      - name: Compare exported API with the base branch
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          module=$(go list -m)
          base=$(git merge-base "$BASE_SHA" HEAD)
          git worktree add --detach "$RUNNER_TEMP/base" "$base"
          (cd "$RUNNER_TEMP/base" && apidiff -m -w "$RUNNER_TEMP/base.api" "$module")
          apidiff -m -w "$RUNNER_TEMP/head.api" "$module"
          # apidiff runs on its own, so a failure fails the step; only grep's
          # no-match status (1) is tolerated below.
          apidiff -m "$RUNNER_TEMP/base.api" "$RUNNER_TEMP/head.api" > "$RUNNER_TEMP/apidiff-all.txt"
          grep -v '^Ignoring internal package' "$RUNNER_TEMP/apidiff-all.txt" | tee "$RUNNER_TEMP/apidiff.txt" || [[ $? -eq 1 ]]
          apidiff -m -incompatible "$RUNNER_TEMP/base.api" "$RUNNER_TEMP/head.api" > "$RUNNER_TEMP/incompatible-all.txt"
          # Symbol changes print as "- ./pkg/...", and a removed (deleted,
          # renamed or moved) package as "- package <module>/pkg/...: removed".
          module_re=${module//./\\.}
          grep -E "^- (\./pkg/|package $module_re/pkg/)" "$RUNNER_TEMP/incompatible-all.txt" > "$RUNNER_TEMP/incompatible.txt" || [[ $? -eq 1 ]]

          if [[ ! -s "$RUNNER_TEMP/incompatible.txt" ]]; then
            echo "No incompatible API changes under ./pkg." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          {
            echo "### Incompatible API changes under ./pkg"
            echo '```'
            cat "$RUNNER_TEMP/incompatible.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          # Read the bump from each entry's leading "---" frontmatter only, as
          # the changelogs tool does; README.md documents the format.
          bump=""
          while IFS= read -r file; do
            if awk 'NR == 1 { if ($0 != "---") exit; next } $0 == "---" { exit } { print }' "$file" \
              | grep -Eq "^$module_re: (minor|major)[[:space:]]*$"; then
              bump="$file"
            fi
          done < <(git diff --name-only --diff-filter=AM "$base" HEAD -- '.changelog/*.md' ':(exclude).changelog/README.md')

          if [[ -n "$bump" ]]; then
            echo "::warning::Incompatible API changes are declared by $bump."
            exit 0
          fi
          cat "$RUNNER_TEMP/incompatible.txt"
          echo "::error::Incompatible API changes under ./pkg need a .changelog/*.md entry with '$module: minor' (or major), or a compatible alternative (add, don't remove; deprecate instead)."
          exit 1
