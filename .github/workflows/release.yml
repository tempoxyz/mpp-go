name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Create release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@35019557465e3c38ee3468be171771fd73577584 # 2026-10-20T06-22-38Z-35019557
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Extract changelog for this version
        id: changelog
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          MODULE=$(awk '$1 == "module" { print $2; exit }' go.mod)
          NOTES=$(awk -v version="$VERSION" -v module="$MODULE" '
            /^## / {
              if (found) exit
              if ($0 ~ "^## \\[" version "\\]([[:space:]]|$)") {
                found = 1
                next
              }
              if (module != "" && ($0 == "## `" module "@" version "`" || $0 == "## " module "@" version)) {
                found = 1
                next
              }
            }
            found { print }
          ' CHANGELOG.md)
          {
            echo "notes<<EOF"
            echo "$NOTES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ steps.changelog.outputs.notes }}
        run: |
          # The changelogs action usually creates the release when it pushes the
          # tag; only create one here if it does not exist yet.
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; skipping."
            exit 0
          fi
          notes_file="$(mktemp)"
          printf '%s\n' "$NOTES" > "$notes_file"
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --notes-file "$notes_file"
