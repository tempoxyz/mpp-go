name: Bug report
description: Report something in mpp-go that is broken.
labels: ['bug']
body:
  - type: checkboxes
    attributes:
      label: Existing issues
      options:
        - label: I searched the [existing issues](https://github.com/tempoxyz/mpp-go/issues) and this bug is not already reported.
          required: true

  - type: textarea
    attributes:
      label: Description
      description: What happened, and what did you expect to happen instead?
    validations:
      required: true

  - type: textarea
    attributes:
      label: Reproduction
      description: Minimal code or steps that reproduce the bug. You can also link a repository or a branch on your fork.
    validations:
      required: true

  - type: input
    attributes:
      label: Version
      description: Which version of `github.com/tempoxyz/mpp-go` are you using?
      placeholder: vX.Y.Z (from go.mod)
    validations:
      required: true

  - type: textarea
    attributes:
      label: Environment
      description: Go version, OS, and anything else that might matter.
    validations:
      required: false
